<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: operators-field-guide-primary.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ranga:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1504px">
  <div class="r-navigation-rail region chrome" data-region="navigation-rail"><!-- fixed light application rail with brand, navigation, and operator account --></div>
  <div class="r-page-heading region text" data-region="page-heading"><!-- Admin Home heading and concise payment-activity description --><p style="font-size:var(--r-page-heading-font);font-family:var(--r-page-heading-family),sans-serif;font-weight:var(--r-page-heading-weight);line-height:1.05;margin:0">page-heading</p></div>
  <div class="r-date-control region control" data-region="date-control"><!-- date-range selector: rebuild the control's chrome from the crop (comp-spec.mjs --crop date-control); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-metric-strip region chrome" data-region="metric-strip"><!-- three compact operational metric cards --></div>
  <div class="r-settlement-title region text" data-region="settlement-title"><!-- Settlement trend title and supporting description --><p style="font-size:var(--r-settlement-title-font);line-height:1.05;margin:0">settlement-title</p></div>
  <div class="r-settlement-controls region control" data-region="settlement-controls"><!-- compact metric switcher: rebuild the control's chrome from the crop (comp-spec.mjs --crop settlement-controls); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-settlement-chart region chrome" data-region="settlement-chart"><!-- primary responsive payment settlement chart --></div>
  <div class="r-supporting-chart region chrome" data-region="supporting-chart"><!-- supporting payout chart --></div>
  <div class="r-payments-table-title region text" data-region="payments-table-title"><!-- recent payments title --><p style="font-size:var(--r-payments-table-title-font);line-height:1.05;margin:0">payments-table-title</p></div>
  <div class="r-payouts-table-title region text" data-region="payouts-table-title"><!-- payout status title --><p style="line-height:1.05;margin:0">payouts-table-title</p></div>
  <div class="r-payments-table region chrome" data-region="payments-table"><!-- recent payments table --></div>
  <div class="r-payouts-table region chrome" data-region="payouts-table"><!-- payout status table --></div>
</main>
</body>
</html>
